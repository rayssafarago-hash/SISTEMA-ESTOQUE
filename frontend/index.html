<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Controle de Estoque</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="login-tela">
    <div class="login-card">
      <h1>Controle de Estoque</h1>
      <p class="sub">Entre com seu usuario para continuar</p>
 
      <div id="mensagem" class="mensagem"></div>
 
      <form id="form-login">
        <div class="form-linha">
          <label for="email">E-mail</label>
          <input type="email" id="email" placeholder="admin@estoque.com" required>
        </div>
        <div class="form-linha">
          <label for="senha">Senha</label>
          <input type="password" id="senha" placeholder="Sua senha" required>
        </div>
        <button type="submit" class="btn" style="width:100%">Entrar</button>
      </form>
      <p class="sub" style="margin-top:16px;text-align:center">
        Teste: admin@estoque.com / 123456
      </p>
    </div>
  </div>
 
  <script src="js/config.js"></script>
  <script src="js/api.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
